AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Employee Portal – Full Serverless Stack (Backend + Auth + Frontend Infra)

Parameters:
  FrontendDomainName:
    Type: String
    Default: demo.mydgv.com

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        ATTENDANCE_TABLE: !Ref AttendanceTable
        WORK_TABLE: !Ref WorkTasksTable
        PERFORMANCE_TABLE: !Ref PerformanceTable
        TRAINING_PROGRESS_TABLE: !Ref TrainingProgressTable
        USER_ACCESS_TABLE: !Ref UserAccessTable

Resources:
  # =====================================================
  # 1️⃣ COGNITO
  # =====================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"`
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
            # REQUIRED for Hosted UI
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      SupportedIdentityProviders:
      - COGNITO

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - http://localhost:3000/callback
        - !Sub "https://${FrontendDomainName}/callback"
      LogoutURLs:
        - http://localhost:3000
        - !Sub "https://${FrontendDomainName}"

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-auth"
      UserPoolId: !Ref CognitoUserPool

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref CognitoUserPool

  CognitoEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      UserPoolId: !Ref CognitoUserPool

  # =====================================================
  # 2️⃣ API GATEWAY LOGGING (NEW)
  # =====================================================

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-prod"
      RetentionInDays: 14

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ApiGatewayCloudWatchRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # =====================================================
  # 3️⃣ API GATEWAY
  # =====================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod

      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowOrigin: "'*'"

      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  # =====================================================
  # 3️⃣ DYNAMODB
  # =====================================================

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Attendance"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  WorkTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-WorkTasks"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  PerformanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Performance"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  TrainingProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-TrainingProgress"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  UserAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-UserAccess"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  UserProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-UserProfile"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  TrainingMaterialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Training_Materials"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SkillMasterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-SkillMaster"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ResignationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Resignations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # =====================================================
  # 4️⃣ LAMBDAS (ALL INCLUDED)
  # =====================================================

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AttendanceFunction"
      Handler: src/attendance/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref AttendanceTable
      Events:
        AttendancePostApi:
          Type: Api
          Properties:
            Path: /attendance
            Method: POST
            RestApiId: !Ref ApiGateway
        AttendanceGetApi:
          Type: Api
          Properties:
            Path: /attendance
            Method: GET
            RestApiId: !Ref ApiGateway

  TrainingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-TrainingFunction"
      Handler: src/training/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TrainingProgressTable
      Events:
        TrainingGetApi:
          Type: Api
          Properties:
            Path: /training
            Method: GET
            RestApiId: !Ref ApiGateway
        TrainingPostApi:
          Type: Api
          Properties:
            Path: /training
            Method: POST
            RestApiId: !Ref ApiGateway

  WorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-WorkFunction"
      Handler: src/work/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkTasksTable
      Events:
        WorkApi:
          Type: Api
          Properties:
            Path: /work
            Method: GET
            RestApiId: !Ref ApiGateway

  PerformanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-PerformanceFunction"
      Handler: src/performance/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref PerformanceTable
      Events:
        PerformanceApi:
          Type: Api
          Properties:
            Path: /performance
            Method: GET
            RestApiId: !Ref ApiGateway

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminFunction"
      Handler: src/admin/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkTasksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserAccessTable
      Events:
        AdminUsersGetApi:
          Type: Api
          Properties:
            Path: /admin/users
            Method: GET
            RestApiId: !Ref ApiGateway
        AdminUsersPostApi:
          Type: Api
          Properties:
            Path: /admin/users
            Method: POST
            RestApiId: !Ref ApiGateway

  AccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AccessFunction"
      Handler: src/access/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserAccessTable
      Events:
        AccessApi:
          Type: Api
          Properties:
            Path: /access
            Method: GET
            RestApiId: !Ref ApiGateway
        RequestAccessApi:
          Type: Api
          Properties:
            Path: /request-access
            Method: POST
            RestApiId: !Ref ApiGateway

  MockTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-MockTestFunction"
      Handler: src/llm/mockTest.handler
      Policies: [AWSLambdaBasicExecutionRole]
      Events:
        MockTestApi:
          Type: Api
          Properties:
            Path: /training/mock-test
            Method: POST
            RestApiId: !Ref ApiGateway

  # =====================================================
  # 5️⃣ S3 BUCKETS
  # =====================================================

  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-profile-images"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  TrainingMaterialBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-training-material"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
  ImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ImageUploadFunction"
      Handler: backend/lambda/ImageUpload/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3WritePolicy:
            BucketName: !Ref ProfileImagesBucket
      Environment:
        Variables:
          PROFILE_IMAGE_BUCKET: !Ref ProfileImagesBucket
      Events:
        UploadImageApi:
          Type: Api
          Properties:
            Path: /getProfileImageUploadUrl
            Method: POST
            RestApiId: !Ref ApiGateway

  UserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-UserProfileFunction"
      Handler: backend/lambda/UserProfileFunction/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfileTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserAccessTable
      Environment:
        Variables:
          USER_ACCESS_TABLE: !Ref UserAccessTable
          USER_POOL_ID: !Ref CognitoUserPool
          USER_PROFILE_TABLE: !Ref UserProfileTable
      Events:
        UserProfileFnApi:
          Type: Api
          Properties:
            Path: /admin/save-user-profile
            Method: POST
            RestApiId: !Ref ApiGateway

  UserProfile:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-UserProfile"
      Handler: backend/lambda/UserProfile/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfileTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserAccessTable
      Environment:
        Variables:
          ACCESS_TABLE: !Ref UserAccessTable
          USER_POOL_ID: !Ref CognitoUserPool
          USER_PROFILE_TABLE: !Ref UserProfileTable
      Events:
        UserProfileApi:
          Type: Api
          Properties:
            Path: /user/profile
            Method: GET
            RestApiId: !Ref ApiGateway
        AdminGetUserProfileApi:
          Type: Api
          Properties:
            Path: /admin/getUserProfile
            Method: GET
            RestApiId: !Ref ApiGateway

  TrainingVideoUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-TrainingVideoUrl"
      Handler: backend/lambda/TrainingVideoUrl/app.handler
      Policies: [AWSLambdaBasicExecutionRole]
      Events:
        TrainingVideoUrlApi:
          Type: Api
          Properties:
            Path: /getTrainingVideoUrl
            Method: POST
            RestApiId: !Ref ApiGateway

  trainingUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-trainingUrl"
      Handler: backend/lambda/trainingUrl/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3ReadPolicy:
            BucketName: !Ref TrainingMaterialBucket
      Environment:
        Variables:
          TRAINING_BUCKET: !Ref TrainingMaterialBucket
      Events:
        TrainingUrlApi:
          Type: Api
          Properties:
            Path: /getTrainingUploadUrl
            Method: POST
            RestApiId: !Ref ApiGateway

  UserTrainingList:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-UserTrainingList"
      Handler: backend/lambda/UserTrainingList/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref TrainingMaterialsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfileTable
      Environment:
        Variables:
          TRAINING_TABLE: !Ref TrainingMaterialsTable
          USER_PROFILE_TABLE: !Ref UserProfileTable
      Events:
        UserTrainingListApi:
          Type: Api
          Properties:
            Path: /getUserTrainingList
            Method: POST
            RestApiId: !Ref ApiGateway

  getSkills:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-getSkills"
      Handler: backend/lambda/getSkills/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref SkillMasterTable
      Environment:
        Variables:
          SKILL_TABLE: !Ref SkillMasterTable
      Events:
        GetSkillsApi:
          Type: Api
          Properties:
            Path: /skills
            Method: GET
            RestApiId: !Ref ApiGateway

  resignation:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-resignation"
      Handler: backend/lambda/resignation/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ResignationsTable
      Environment:
        Variables:
          RESIGNATIONS_TABLE: !Ref ResignationsTable
      Events:
        ResignationApi:
          Type: Api
          Properties:
            Path: /resignation
            Method: POST
            RestApiId: !Ref ApiGateway

  addTraining:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-addTraining"
      Handler: backend/lambda/addTraining/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TrainingMaterialsTable
        - S3WritePolicy:
            BucketName: !Ref TrainingMaterialBucket
      Environment:
        Variables:
          TRAINING_BUCKET: !Ref TrainingMaterialBucket
      Events:
        AddTrainingApi:
          Type: Api
          Properties:
            Path: /addTrainingMaterial
            Method: POST
            RestApiId: !Ref ApiGateway

  # =====================================================
  # 5️⃣ FRONTEND (S3 + CLOUDFRONT HTTPS)
  # =====================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        # DefaultRootObject: index.html
        # Aliases: [!Ref FrontendDomainName]
        # ViewerCertificate:
        #   AcmCertificateArn: arn:aws:acm:us-east-1:985539754737:certificate/f7afd075-177d-41d4-a782-3abbab82df5b
        #   SslSupportMethod: sni-only
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOAC
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

# =====================================================
# OUTPUTS
# =====================================================

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CognitoHostedUI:
    Value: !Sub "https://${CognitoDomain}.auth.${AWS::Region}.amazoncognito.com"

  UserPoolClientId:
    Value: !Ref CognitoUserPoolClient

  FrontendURL:
    Value: !Sub "https://${FrontendDomainName}"

  FrontendBucketName:
    Value: !Ref FrontendBucket
