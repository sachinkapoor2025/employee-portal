AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Employee Portal – Full Serverless Stack (Backend + Auth + Frontend Infra)

Parameters:
  FrontendDomainName:
    Type: String
    Default: login.mydgv.com

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: Users
        ATTENDANCE_TABLE: Attendance
        WORK_TABLE: WorkTasks
        PERFORMANCE_TABLE: Performance
        TRAINING_PROGRESS_TABLE: TrainingProgress
        USER_ACCESS_TABLE: UserAccess

Resources:

# =====================================================
# 1️⃣ COGNITO
# =====================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: employee-portal-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: employee-portal-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [ implicit ]
      AllowedOAuthScopes: [ email, openid ]
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - http://localhost:3000/callback
        - !Sub "https://${FrontendDomainName}/callback"
      LogoutURLs:
        - http://localhost:3000
        - !Sub "https://${FrontendDomainName}"

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: employee-portal-auth
      UserPoolId: !Ref CognitoUserPool

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref CognitoUserPool

  CognitoEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      UserPoolId: !Ref CognitoUserPool

  # =====================================================
# 2️⃣ API GATEWAY LOGGING (NEW)
# =====================================================

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-prod"
      RetentionInDays: 14

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

# =====================================================
# 3️⃣ API GATEWAY
# =====================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: prod

      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowOrigin: "'*'"

      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

# =====================================================
# 3️⃣ DYNAMODB
# =====================================================

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Attendance
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  WorkTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WorkTasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  PerformanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Performance
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  TrainingProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrainingProgress
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  UserAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserAccess
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

# =====================================================
# 4️⃣ LAMBDAS (ALL INCLUDED)
# =====================================================

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/attendance/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: Attendance
      Events:
        AttendancePostApi:
          Type: Api
          Properties:
            Path: /attendance
            Method: POST
            RestApiId: !Ref ApiGateway
        AttendanceGetApi:
          Type: Api
          Properties:
            Path: /attendance
            Method: GET
            RestApiId: !Ref ApiGateway

  TrainingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/training/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: TrainingProgress
      Events:
        TrainingGetApi:
          Type: Api
          Properties:
            Path: /training
            Method: GET
            RestApiId: !Ref ApiGateway
        TrainingPostApi:
          Type: Api
          Properties:
            Path: /training
            Method: POST
            RestApiId: !Ref ApiGateway

  WorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/work/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: WorkTasks
      Events:
        WorkApi:
          Type: Api
          Properties:
            Path: /work
            Method: GET
            RestApiId: !Ref ApiGateway

  PerformanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/performance/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: Performance
      Events:
        PerformanceApi:
          Type: Api
          Properties:
            Path: /performance
            Method: GET
            RestApiId: !Ref ApiGateway

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/admin/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: WorkTasks
        - DynamoDBCrudPolicy:
            TableName: UserAccess
      Events:
        AdminUsersGetApi:
          Type: Api
          Properties:
            Path: /admin/users
            Method: GET
            RestApiId: !Ref ApiGateway
        AdminUsersPostApi:
          Type: Api
          Properties:
            Path: /admin/users
            Method: POST
            RestApiId: !Ref ApiGateway

  AccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/access/handler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: UserAccess
      Events:
        AccessApi:
          Type: Api
          Properties:
            Path: /access
            Method: GET
            RestApiId: !Ref ApiGateway
        RequestAccessApi:
          Type: Api
          Properties:
            Path: /request-access
            Method: POST
            RestApiId: !Ref ApiGateway

  MockTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/llm/mockTest.handler
      Policies: [ AWSLambdaBasicExecutionRole ]
      Events:
        MockTestApi:
          Type: Api
          Properties:
            Path: /training/mock-test
            Method: POST
            RestApiId: !Ref ApiGateway

# =====================================================
# 5️⃣ FRONTEND (S3 + CLOUDFRONT HTTPS)
# =====================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "employee-portal-ui-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: employee-portal-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: [ !Ref FrontendDomainName ]
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:985539754737:certificate/f7afd075-177d-41d4-a782-3abbab82df5b
          SslSupportMethod: sni-only
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOAC
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [ GET, HEAD, OPTIONS ]
          CachedMethods: [ GET, HEAD ]
          ForwardedValues:
            QueryString: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

# =====================================================
# OUTPUTS
# =====================================================

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CognitoHostedUI:
    Value: !Sub "https://${CognitoDomain}.auth.${AWS::Region}.amazoncognito.com"

  UserPoolClientId:
    Value: !Ref CognitoUserPoolClient

  FrontendURL:
    Value: !Sub "https://${FrontendDomainName}"
