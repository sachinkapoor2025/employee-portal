<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DGV Documents — Interactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dgv-font: "Inter", "Segoe UI", sans-serif;
      --dgv-font-display: "Plus Jakarta Sans", "Inter", sans-serif;
      --dgv-primary: #172033;
      --dgv-primary-hover: #101624;
      --dgv-accent: #8B5CF6;
      --dgv-accent-hover: #7C3AED;
      --dgv-accent-soft: rgba(139, 92, 246, 0.1);
      --dgv-info: #2563EB;
      --dgv-info-bg: rgba(37, 99, 235, 0.1);
      --dgv-bg: #F6F7F9;
      --dgv-surface: #FFFFFF;
      --dgv-text: #172033;
      --dgv-text-secondary: #475569;
      --dgv-text-muted: #7B8494;
      --dgv-border: #E2E6EC;
      --dgv-danger: #DC2626;
      --dgv-danger-bg: rgba(220, 38, 38, 0.1);
      --dgv-success: #15803D;
      --dgv-radius: 14px;
      --dgv-radius-sm: 8px;
      --dgv-shadow-sm: 0 4px 16px rgba(23, 32, 51, 0.08);
      --dgv-overlay: rgba(23, 32, 51, 0.45);
      --dgv-sidebar-w: 248px;
      --dgv-navbar-h: 64px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--dgv-font);
      color: var(--dgv-text);
      background: var(--dgv-bg);
    }
    button, input, select { font: inherit; }
    .app { display: grid; grid-template-columns: var(--dgv-sidebar-w) 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--dgv-surface);
      border-right: 1px solid var(--dgv-border);
      padding: 20px 16px;
    }
    .brand {
      font-family: var(--dgv-font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      margin: 0 8px 28px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      color: var(--dgv-text-secondary); font-weight: 600; font-size: 14px;
    }
    .nav-item.active { background: var(--dgv-accent-soft); color: var(--dgv-accent-hover); }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: var(--dgv-navbar-h);
      background: var(--dgv-surface);
      border-bottom: 1px solid var(--dgv-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 16px;
    }
    .demo-note {
      background: #EEF2FF;
      color: #312E81;
      font-size: 13px;
      padding: 10px 24px;
      border-bottom: 1px solid #C7D2FE;
    }
    .content { padding: 28px 24px 48px; max-width: 1100px; }
    .page-card {
      background: var(--dgv-surface);
      border: 1px solid var(--dgv-border);
      border-radius: var(--dgv-radius);
      padding: 24px;
    }
    h1 { font-family: var(--dgv-font-display); font-size: 26px; margin: 0 0 6px; }
    .subtitle { color: var(--dgv-text-muted); margin: 0 0 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .role-switch, .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .who { color: var(--dgv-text-secondary); font-size: 13px; }
    .seg { display: flex; background: var(--dgv-bg); border-radius: 10px; padding: 3px; }
    .seg button {
      border: 0; background: transparent; padding: 6px 12px; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 13px; color: var(--dgv-text-secondary);
    }
    .seg button.active { background: var(--dgv-surface); color: var(--dgv-text); box-shadow: var(--dgv-shadow-sm); }
    .icon-btn, .bell {
      width: 40px; height: 40px; border: 1px solid var(--dgv-border); border-radius: 10px;
      background: var(--dgv-surface); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; position: relative; color: var(--dgv-text-secondary);
    }
    .icon-btn.sm { width: 32px; height: 32px; min-width: 32px; }
    .badge {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
      background: var(--dgv-danger); color: #fff; border-radius: 999px;
      font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
    }
    .btn {
      border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 13px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--dgv-primary); color: #fff; }
    .btn-primary:hover { background: var(--dgv-primary-hover); }
    .btn-outline { background: #fff; color: var(--dgv-text); border: 1px solid var(--dgv-border); }
    .btn-ghost { background: transparent; color: var(--dgv-text-secondary); }
    .btn-danger { background: var(--dgv-danger); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .crumb button {
      border: 0; background: none; cursor: pointer; font-weight: 600; font-size: 12px;
      color: var(--dgv-text-muted); padding: 0; max-width: 180px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .crumb button.here { color: var(--dgv-text-secondary); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .folder-card {
      border: 1px solid var(--dgv-border); border-radius: var(--dgv-radius);
      padding: 16px; min-height: 120px; cursor: pointer;
      display: flex; flex-direction: column; gap: 10px; background: #fff;
    }
    .folder-card:hover { border-color: #c9cfe0; }
    .folder-top { display: flex; justify-content: space-between; gap: 8px; }
    .folder-card .actions { display: none; gap: 4px; }
    .folder-card:hover .actions, .folder-card:focus-within .actions { display: flex; }
    .pin {
      font-size: 11px; font-weight: 700; color: var(--dgv-info); background: var(--dgv-info-bg);
      border-radius: 999px; padding: 3px 8px;
    }
    .file-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid var(--dgv-border); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
    }
    .muted { color: var(--dgv-text-muted); font-size: 12px; }
    .alert { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
    .alert-info { background: var(--dgv-info-bg); color: #1e3a8a; }
    .alert-error { background: var(--dgv-danger-bg); color: var(--dgv-danger); }
    .label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--dgv-text-secondary); }
    .field { width: 100%; border: 1px solid var(--dgv-border); border-radius: 10px; padding: 9px 11px; background: #fff; }
    .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .overlay {
      position: fixed; inset: 0; background: var(--dgv-overlay);
      display: none; align-items: center; justify-content: center; z-index: 40; padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; width: min(480px, 100%);
      padding: 20px; box-shadow: 0 12px 32px rgba(23,32,51,.12);
    }
    .modal h3 { margin: 0 0 14px; font-size: 18px; }
    .modal .row { margin-bottom: 12px; }
    .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .notify-wrap { position: relative; }
    .notify-panel {
      display: none; position: absolute; right: 0; top: 48px; width: 360px;
      background: #fff; border: 1px solid var(--dgv-border); border-radius: 14px;
      box-shadow: var(--dgv-shadow-sm); z-index: 30; max-height: 420px; overflow: auto;
    }
    .notify-panel.open { display: block; }
    .notify-item { padding: 12px 14px; border-bottom: 1px solid var(--dgv-border); cursor: pointer; }
    .notify-item:hover { background: var(--dgv-bg); }
    .notify-item.unread { background: var(--dgv-accent-soft); }
    .empty { color: var(--dgv-text-muted); }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .picker { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <p class="brand">DGV Portal</p>
      <div class="nav-item">Dashboard</div>
      <div class="nav-item active">Documents</div>
      <div class="nav-item">Tasks</div>
      <div class="nav-item">Leave</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="role-switch">
          <span class="muted">View as</span>
          <div class="seg" id="roleSeg">
            <button type="button" data-role="employee">Employee</button>
            <button type="button" data-role="admin" class="active">Admin</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="who" id="whoLabel"></span>
          <button type="button" class="btn btn-ghost" id="resetBtn">Reset demo</button>
          <div class="notify-wrap">
            <button type="button" class="bell" id="bellBtn" aria-label="Notifications">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span class="badge" id="bellBadge" hidden>0</span>
            </button>
            <div class="notify-panel" id="notifyPanel"></div>
          </div>
        </div>
      </header>
      <div class="demo-note">
        Interactive HTML demo — not connected to AWS. Switch Employee / Admin, try Projects and Personal, then tell us what to change. This portal has no Manager role.
      </div>
      <main class="content">
        <div class="page-card">
          <h1>Documents</h1>
          <p class="subtitle">Browse company project folders and keep personal files organized.</p>
          <div class="tabs">
            <button type="button" class="btn btn-primary" id="tabProjects">Projects</button>
            <button type="button" class="btn btn-ghost" id="tabPersonal">Personal</button>
          </div>
          <div id="view"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script>
    const STORE_KEY = "dgv-documents-demo-v2";
    const NESTING_CAP = 10;
    const MAX_BYTES = 10 * 1024 * 1024;
    const ALLOWED = [".pdf", ".jpg", ".jpeg", ".png", ".doc", ".docx", ".xls", ".xlsx"];
    const REQUIRED_NAME = "Required Documents";
    const REQUIRED_ID = "required-documents";

    const PEOPLE = [
      { email: "priya.admin@mydgv.com", name: "Priya Nair", role: "admin" },
      { email: "rahul@mydgv.com", name: "Rahul Sharma", role: "employee" },
      { email: "anika@mydgv.com", name: "Anika Mehta", role: "employee" },
      { email: "kabir@mydgv.com", name: "Kabir Das", role: "employee" },
    ];

    const I = {
      folder: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.2 3.9A2 2 0 0 0 7.5 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>',
      pin: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
      file: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7B8494" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
      back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      chev: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7B8494" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
      plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.2 3.9A2 2 0 0 0 7.5 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>',
      upload: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
      down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      pencil: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
      trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    };

    const $ = (id) => document.getElementById(id);

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }
    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function extOf(name) {
      const i = String(name).lastIndexOf(".");
      return i >= 0 ? name.slice(i).toLowerCase() : "";
    }
    function formatSize(n) {
      n = Number(n);
      if (!Number.isFinite(n) || n <= 0) return "";
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
      return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }
    function formatWhen(value) {
      if (!value) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        const d = new Date(`${value}T12:00:00`);
        return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
      }
      const d = new Date(value);
      return Number.isFinite(d.getTime())
        ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
        : String(value);
    }
    function relativeTime(value) {
      const ms = Date.parse(value || "");
      if (!Number.isFinite(ms)) return "";
      const minutes = Math.round((Date.now() - ms) / 60000);
      if (minutes < 1) return "Just now";
      if (minutes < 60) return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"} ago`;
      const days = Math.round(hours / 24);
      return `${days} day${days === 1 ? "" : "s"} ago`;
    }
    function uniqueName(name, taken, keepExt) {
      const set = new Set((taken || []).map((n) => String(n).toLowerCase()));
      let base = String(name || "Untitled").trim() || "Untitled";
      if (!set.has(base.toLowerCase())) return base;
      let stem = base, ext = "";
      if (keepExt) {
        const i = base.lastIndexOf(".");
        if (i > 0) { stem = base.slice(0, i); ext = base.slice(i); }
      }
      let n = 1;
      while (set.has(`${stem} (${n})${ext}`.toLowerCase())) n += 1;
      return `${stem} (${n})${ext}`;
    }
    function isReserved(name) {
      return String(name || "").trim().toLowerCase() === REQUIRED_NAME.toLowerCase();
    }
    function isPinned(item) {
      return Boolean(item?.isSystem) || item?.id === REQUIRED_ID || isReserved(item?.name);
    }
    function canManageProjects(role) {
      return role === "admin";
    }
    function personByRole(role) {
      const safe = role === "admin" ? "admin" : "employee";
      return PEOPLE.find((p) => p.role === safe) || PEOPLE[1];
    }
    function personByEmail(email) {
      return PEOPLE.find((p) => p.email === email);
    }
    function sampleBlob(label) {
      return `data:text/plain;charset=utf-8,${encodeURIComponent(`DGV demo file: ${label}`)}`;
    }

    function emptyFolder(id, name, parentId) {
      return { id, name, parentId: parentId || null, children: [] };
    }

    function seedPersonal(email, extraFolders) {
      const req = emptyFolder(REQUIRED_ID, REQUIRED_NAME, "root");
      req.children = [
        { id: uid(), type: "file", name: "Aadhaar Card.pdf", fileId: uid(), size: 184320, uploadedBy: email, uploadedAt: "2026-04-12", description: "KYC", dataUrl: sampleBlob("Aadhaar") },
        { id: uid(), type: "file", name: "PAN Card.pdf", fileId: uid(), size: 96256, uploadedBy: email, uploadedAt: "2026-04-12", description: "KYC", dataUrl: sampleBlob("PAN") },
      ];
      const folders = { [REQUIRED_ID]: req };
      const children = [{ id: REQUIRED_ID, type: "folder", name: REQUIRED_NAME, isSystem: true }];
      (extraFolders || []).forEach((f) => {
        folders[f.id] = emptyFolder(f.id, f.name, "root");
        if (f.files) folders[f.id].children = f.files;
        children.push({ id: f.id, type: "folder", name: f.name });
      });
      return { root: { id: "root", name: "Personal", parentId: null, children }, folders };
    }

    function seedState() {
      const onboardingContracts = uid();
      const alphaDesign = uid();
      return {
        role: "admin",
        tab: "projects",
        lastSeenAt: null,
        notifications: [
          {
            eventId: uid(),
            timestamp: new Date(Date.now() - 36e5).toISOString(),
            projectId: "proj-onboarding",
            projectName: "Onboarding 2026",
            folderPath: "Onboarding 2026 / Contracts",
            fileCount: 2,
            uploadedBy: "priya.admin@mydgv.com",
          },
        ],
        projects: [
          {
            id: "proj-onboarding",
            name: "Onboarding 2026",
            createdAt: "2026-03-01",
            folders: {
              root: {
                id: "root",
                name: "Onboarding 2026",
                parentId: null,
                children: [
                  { id: onboardingContracts, type: "folder", name: "Contracts" },
                  { id: uid(), type: "file", name: "Welcome pack.pdf", fileId: uid(), size: 245760, uploadedBy: "priya.admin@mydgv.com", uploadedAt: "2026-03-02", description: "New joiner pack", dataUrl: sampleBlob("Welcome pack") },
                ],
              },
              [onboardingContracts]: {
                id: onboardingContracts,
                name: "Contracts",
                parentId: "root",
                children: [
                  { id: uid(), type: "file", name: "Offer template.docx", fileId: uid(), size: 51200, uploadedBy: "priya.admin@mydgv.com", uploadedAt: "2026-03-04", description: "Template", dataUrl: sampleBlob("Offer") },
                ],
              },
            },
          },
          {
            id: "proj-alpha",
            name: "Client Alpha",
            createdAt: "2026-05-10",
            folders: {
              root: {
                id: "root",
                name: "Client Alpha",
                parentId: null,
                children: [{ id: alphaDesign, type: "folder", name: "Design" }],
              },
              [alphaDesign]: {
                id: alphaDesign,
                name: "Design",
                parentId: "root",
                children: [
                  { id: uid(), type: "file", name: "Brand guidelines.pdf", fileId: uid(), size: 890000, uploadedBy: "priya.admin@mydgv.com", uploadedAt: "2026-05-11", description: "v2", dataUrl: sampleBlob("Brand") },
                ],
              },
            },
          },
          {
            id: "proj-policies",
            name: "Internal Policies",
            createdAt: "2026-01-15",
            folders: {
              root: { id: "root", name: "Internal Policies", parentId: null, children: [] },
            },
          },
        ],
        personal: {
          "priya.admin@mydgv.com": seedPersonal("priya.admin@mydgv.com", [
            { id: uid(), name: "Expense receipts" },
          ]),
          "anika@mydgv.com": seedPersonal("anika@mydgv.com"),
          "rahul@mydgv.com": seedPersonal("rahul@mydgv.com", [
            { id: uid(), name: "Certificates" },
          ]),
          "kabir@mydgv.com": seedPersonal("kabir@mydgv.com"),
        },
        ui: {
          projectId: null,
          trail: [],
          personalOwner: "priya.admin@mydgv.com",
          personalTrail: [],
          userSearch: "",
        },
      };
    }

    let state = load();
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return seedState();
    }
    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function me() {
      return personByRole(state.role);
    }
    function isAdmin() {
      return state.role === "admin";
    }
    function projectById(id) {
      return state.projects.find((p) => p.id === id);
    }
    function folderRecord(project, folderId) {
      const id = !folderId || folderId === "root" ? "root" : folderId;
      return project.folders[id];
    }
    function personalTree(email) {
      if (!state.personal[email]) state.personal[email] = seedPersonal(email);
      return state.personal[email];
    }
    function personalFolder(email, folderId) {
      const tree = personalTree(email);
      const id = !folderId || folderId === "root" ? "root" : folderId;
      return id === "root" ? tree.root : tree.folders[id];
    }
    function countNestedIn(getKids, folderId) {
      const rec = getKids(folderId);
      const kids = rec?.children || [];
      let folders = 0, files = 0;
      for (const c of kids) {
        if (c.type === "file") files += 1;
        else {
          folders += 1;
          const inner = countNestedIn(getKids, c.id);
          folders += inner.folders;
          files += inner.files;
        }
      }
      return { folders, files };
    }
    function folderPathNames(project, folderId) {
      const names = [project.name];
      if (!folderId || folderId === "root") return names.join(" / ");
      const chain = [];
      let cur = folderRecord(project, folderId);
      while (cur && cur.id !== "root") {
        chain.unshift(cur.name);
        cur = folderRecord(project, cur.parentId || "root");
      }
      return [...names, ...chain].join(" / ");
    }
    function unreadCount() {
      const seen = Date.parse(state.lastSeenAt || "");
      return state.notifications.filter((e) => {
        const ms = Date.parse(e.timestamp);
        return Number.isFinite(ms) && (!Number.isFinite(seen) || ms > seen);
      }).length;
    }

    let modalKind = null;
    let pendingFiles = [];

    function closeModal() {
      modalKind = null;
      pendingFiles = [];
      $("overlay").classList.remove("open");
      $("modal").innerHTML = "";
    }
    function openModal(html) {
      $("modal").innerHTML = html;
      $("overlay").classList.add("open");
    }

    function iconAction(label, action, svg) {
      return `<button type="button" class="icon-btn sm" title="${label}" data-act="${action}">${svg}</button>`;
    }

    function renderBell() {
      const n = unreadCount();
      $("bellBadge").hidden = n === 0;
      $("bellBadge").textContent = String(n);
      const items = [...state.notifications].sort((a, b) => Date.parse(b.timestamp) - Date.parse(a.timestamp));
      $("notifyPanel").innerHTML = items.length
        ? items.map((e) => {
            const unread = !state.lastSeenAt || Date.parse(e.timestamp) > Date.parse(state.lastSeenAt);
            return `<div class="notify-item ${unread ? "unread" : ""}" data-event="${e.eventId}">
              <div style="font-weight:700">${e.projectName}</div>
              <div class="muted">${e.folderPath} · ${e.fileCount} file${e.fileCount === 1 ? "" : "s"} uploaded · by ${e.uploadedBy}</div>
              <div class="muted">${relativeTime(e.timestamp)}</div>
            </div>`;
          }).join("")
        : `<div class="notify-item empty">No document notifications yet.</div>`;
    }

    function renderWho() {
      const p = me();
      $("whoLabel").textContent = `${p.name} · ${p.email}`;
      document.querySelectorAll("#roleSeg button").forEach((b) => {
        b.classList.toggle("active", b.dataset.role === state.role);
      });
      $("tabProjects").className = state.tab === "projects" ? "btn btn-primary" : "btn btn-ghost";
      $("tabPersonal").className = state.tab === "personal" ? "btn btn-primary" : "btn btn-ghost";
    }

    function render() {
      renderWho();
      renderBell();
      $("view").innerHTML = state.tab === "projects" ? renderProjects() : renderPersonal();
    }

    function breadcrumb(rootLabel, trail, backAttr) {
      const crumbs = [`<button type="button" data-crumb="-1">${rootLabel}</button>`]
        .concat(trail.map((s, i) => `${I.chev}<button type="button" data-crumb="${i}" class="${i === trail.length - 1 ? "here" : ""}">${escapeHtml(s.name)}</button>`));
      const back = trail.length || rootLabel !== "Projects" && state.ui.personalTrail.length
        ? `<button type="button" class="icon-btn sm" data-act="${backAttr}" title="Back">${I.back}</button>`
        : (state.tab === "projects" && state.ui.projectId
          ? `<button type="button" class="icon-btn sm" data-act="${backAttr}" title="Back">${I.back}</button>`
          : (state.tab === "personal" && state.ui.personalTrail.length
            ? `<button type="button" class="icon-btn sm" data-act="${backAttr}" title="Back">${I.back}</button>`
            : (state.tab === "projects" && state.ui.projectId ? "" : "")));
      const showBack = state.tab === "projects" ? Boolean(state.ui.projectId) : state.ui.personalTrail.length > 0;
      return `<div class="crumb">
        ${showBack ? `<button type="button" class="icon-btn sm" data-act="${backAttr}" title="Back" aria-label="Back">${I.back}</button>` : ""}
        ${crumbs.join("")}
      </div>`;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function folderCard(item, opts) {
      const pinned = opts.pinned;
      const manage = opts.manage && !pinned;
      return `<article class="folder-card" data-open="${opts.open}" data-id="${item.projectId || item.id}">
        <div class="folder-top">
          ${pinned ? I.pin : I.folder}
          ${pinned ? `<span class="pin">Pinned</span>` : manage ? `<div class="actions" onclick="event.stopPropagation()">
            ${iconAction("Rename", opts.rename, I.pencil)}
            ${iconAction("Delete", opts.remove, I.trash)}
          </div>` : ""}
        </div>
        <div style="font-weight:600;word-break:break-word">${escapeHtml(item.name)}</div>
      </article>`;
    }

    function fileRow(file, manage) {
      return `<div class="file-row" data-file="${file.fileId || file.id}">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          ${I.file}
          <div>
            <div style="font-weight:600;word-break:break-word">${escapeHtml(file.name)}</div>
            <div class="muted">${[formatSize(file.size), formatWhen(file.uploadedAt), file.description].filter(Boolean).join(" · ")}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          ${iconAction("Download", "download-file", I.down)}
          ${manage ? iconAction("Rename", "rename-file", I.pencil) + iconAction("Delete", "delete-file", I.trash) : ""}
        </div>
      </div>`;
    }

    function renderProjects() {
      const manage = canManageProjects(state.role);
      const project = projectById(state.ui.projectId);
      if (!project) {
        return `<div class="toolbar">
          ${breadcrumb("Projects", [], "back-project")}
          ${manage ? `<button type="button" class="btn btn-primary" data-act="create-project">New project folder</button>` : ""}
        </div>
        ${state.projects.length
          ? `<div class="grid">${state.projects.map((p) => folderCard({ ...p, projectId: p.id }, { open: "open-project", manage, rename: "rename-project", remove: "delete-project" })).join("")}</div>`
          : `<p class="empty">${manage ? "No project folders yet. Create one to get started." : "No project folders yet."}</p>`}`;
      }
      const folderId = state.ui.trail.length ? state.ui.trail[state.ui.trail.length - 1].id : "root";
      const rec = folderRecord(project, folderId);
      const kids = rec?.children || [];
      const folders = kids.filter((c) => c.type !== "file");
      const files = kids.filter((c) => c.type === "file");
      const tooDeep = state.ui.trail.length >= NESTING_CAP;
      return `<div class="toolbar">
        ${breadcrumb("Projects", [{ id: "root", name: project.name }, ...state.ui.trail.filter((t) => t.id !== "root")], "back-project")}
        ${manage ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          ${tooDeep ? "" : `<button type="button" class="btn btn-outline" data-act="create-folder">${I.plus} New folder</button>`}
          <button type="button" class="btn btn-primary" data-act="upload">${I.upload} Upload files</button>
        </div>` : ""}
      </div>
      ${!folders.length && !files.length ? `<p class="empty">This folder is empty.</p>` : ""}
      ${folders.length ? `<div class="grid">${folders.map((f) => folderCard(f, { open: "open-folder", manage, rename: "rename-folder", remove: "delete-folder" })).join("")}</div>` : ""}
      ${files.map((f) => fileRow(f, manage)).join("")}`;
    }

    function renderPersonal() {
      const self = me();
      const owner = isAdmin() ? (state.ui.personalOwner || self.email) : self.email;
      if (!isAdmin()) state.ui.personalOwner = self.email;
      const tree = personalTree(owner);
      const viewingOther = isAdmin() && owner !== self.email;
      const ownerPerson = personByEmail(owner) || { name: owner, email: owner };
      const q = String(state.ui.userSearch || "").trim().toLowerCase();
      const options = PEOPLE.filter((p) => {
        if (!q) return true;
        return p.name.toLowerCase().includes(q) || p.email.includes(q);
      });
      const folderId = state.ui.personalTrail.length ? state.ui.personalTrail[state.ui.personalTrail.length - 1].id : "root";
      const rec = folderId === "root" ? tree.root : tree.folders[folderId];
      const kids = [...(rec?.children || [])].sort((a, b) => {
        if (isPinned(a)) return -1;
        if (isPinned(b)) return 1;
        return 0;
      });
      const folders = kids.filter((c) => c.type !== "file");
      const files = kids.filter((c) => c.type === "file");
      const trailNames = folderId === "root" ? [] : state.ui.personalTrail;
      const tooDeep = state.ui.personalTrail.length >= NESTING_CAP;
      const manage = true;
      return `
        ${isAdmin() ? `<div class="picker">
          <div>
            <label class="label" for="ownerSearch">Browsing personal folder for</label>
            <input id="ownerSearch" class="field" type="search" placeholder="Search name, email…" value="${escapeHtml(state.ui.userSearch)}" />
          </div>
          <div>
            <label class="label" for="ownerSelect">Employee</label>
            <select id="ownerSelect" class="field">
              ${options.map((p) => `<option value="${p.email}" ${p.email === owner ? "selected" : ""}>${p.email === self.email ? "Me — " : ""}${p.name} (${p.email})</option>`).join("")}
            </select>
          </div>
        </div>` : ""}
        ${viewingOther ? `<div class="alert alert-info">You are viewing ${escapeHtml(ownerPerson.name)}'s personal folder.</div>` : ""}
        <div class="toolbar">
          ${breadcrumb("Personal", trailNames, "back-personal")}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${tooDeep ? "" : `<button type="button" class="btn btn-outline" data-act="create-personal-folder">${I.plus} New folder</button>`}
            <button type="button" class="btn btn-primary" data-act="upload-personal">${I.upload} Upload files</button>
          </div>
        </div>
        ${!folders.length && !files.length ? `<p class="empty">This folder is empty.</p>` : ""}
        ${folders.length ? `<div class="grid">${folders.map((f) => folderCard(f, { open: "open-personal-folder", manage, pinned: isPinned(f), rename: "rename-personal-folder", remove: "delete-personal-folder" })).join("")}</div>` : ""}
        ${files.map((f) => fileRow(f, manage)).join("")}
      `;
    }

    function showNameModal(kind, title, value) {
      modalKind = { type: "name", kind, item: value && typeof value === "object" ? value : null };
      const initial = typeof value === "string" ? value : (value?.name || "");
      openModal(`<h3>${title}</h3>
        <form id="nameForm">
          <div class="row"><label class="label">Name</label><input class="field" id="nameInput" maxlength="120" value="${escapeHtml(initial)}" required /></div>
          <div class="alert alert-error" id="nameErr" hidden></div>
          <div class="footer">
            <button type="button" class="btn btn-outline" data-act="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">${kind.startsWith("create") ? "Create" : "Save"}</button>
          </div>
        </form>`);
      setTimeout(() => $("nameInput")?.focus(), 0);
    }

    function showUploadModal(scope) {
      modalKind = { type: "upload", scope };
      pendingFiles = [];
      openModal(`<h3>Upload files</h3>
        <form id="uploadForm">
          <div class="row"><label class="label">Date</label><input class="field" id="uploadDate" type="date" value="${todayKey()}" required /></div>
          <div class="row">
            <label class="label">Choose files</label>
            <input class="field" id="uploadFiles" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" />
            <div class="muted" style="margin-top:6px">PDF, JPG, PNG, DOC, DOCX, XLS, XLSX · max 10 MB each · multiple files allowed</div>
            <div class="muted" id="fileCount"></div>
          </div>
          <div class="row"><label class="label">Description</label><input class="field" id="uploadDesc" placeholder="Description" /></div>
          <div class="alert alert-error" id="uploadErr" hidden></div>
          <div class="footer">
            <button type="button" class="btn btn-outline" data-act="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Upload</button>
          </div>
        </form>`);
    }

    function showDeleteModal(kind, item, counts) {
      modalKind = { type: "delete", kind, item };
      let copy = `Delete “${item.name}”? This cannot be undone.`;
      if (kind !== "file") {
        const parts = [];
        if (counts.folders) parts.push(`${counts.folders} folder${counts.folders === 1 ? "" : "s"}`);
        if (counts.files) parts.push(`${counts.files} file${counts.files === 1 ? "" : "s"}`);
        const nested = parts.length ? parts.join(" and ") : "no nested items";
        const noun = kind === "project" ? "project folder" : "folder";
        copy = `Delete ${noun} “${item.name}”? It contains ${nested}. This cannot be undone.`;
      }
      openModal(`<h3>Delete</h3>
        <p>${escapeHtml(copy)}</p>
        <div class="footer">
          <button type="button" class="btn btn-outline" data-act="close-modal">Cancel</button>
          <button type="button" class="btn btn-danger" data-act="confirm-delete">Delete</button>
        </div>`);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error("Could not read file."));
        r.readAsDataURL(file);
      });
    }

    function addChildren(list, entries) {
      const taken = list.map((c) => c.name);
      return entries.map((e) => {
        const name = uniqueName(e.name, taken, e.type === "file");
        taken.push(name);
        return { ...e, name };
      });
    }

    function currentProjectFolder() {
      const project = projectById(state.ui.projectId);
      const folderId = state.ui.trail.length ? state.ui.trail[state.ui.trail.length - 1].id : "root";
      return { project, folderId, rec: folderRecord(project, folderId) };
    }
    function currentPersonalFolder() {
      const owner = isAdmin() ? state.ui.personalOwner : me().email;
      const folderId = state.ui.personalTrail.length ? state.ui.personalTrail[state.ui.personalTrail.length - 1].id : "root";
      return { owner, folderId, rec: personalFolder(owner, folderId), tree: personalTree(owner) };
    }

    async function handleUpload(scope) {
      const errEl = $("uploadErr");
      const date = $("uploadDate").value;
      const desc = $("uploadDesc").value.trim();
      const files = pendingFiles.length ? pendingFiles : Array.from($("uploadFiles").files || []);
      if (!date) { errEl.hidden = false; errEl.textContent = "Please select a date."; return; }
      if (!files.length) { errEl.hidden = false; errEl.textContent = "Please choose at least one file."; return; }
      const ok = [];
      const failed = [];
      for (const file of files) {
        const ext = extOf(file.name);
        if (!ALLOWED.includes(ext)) {
          failed.push(`${file.name}: invalid type`);
          continue;
        }
        if (file.size > MAX_BYTES) {
          failed.push(`${file.name}: exceeds 10 MB`);
          continue;
        }
        if (file.size <= 0) {
          failed.push(`${file.name}: empty file`);
          continue;
        }
        try {
          const dataUrl = await readFileAsDataUrl(file);
          ok.push({
            id: uid(),
            type: "file",
            name: file.name,
            fileId: uid(),
            size: file.size,
            uploadedBy: me().email,
            uploadedAt: date,
            description: desc,
            dataUrl,
          });
        } catch {
          failed.push(`${file.name}: could not read`);
        }
      }
      if (!ok.length) {
        errEl.hidden = false;
        errEl.textContent = failed.join(" · ");
        return;
      }
      if (scope === "project") {
        if (!canManageProjects(state.role)) return;
        const { project, rec } = currentProjectFolder();
        rec.children.push(...addChildren(rec.children, ok));
        state.notifications.push({
          eventId: uid(),
          timestamp: new Date().toISOString(),
          projectId: project.id,
          projectName: project.name,
          folderPath: folderPathNames(project, rec.id),
          fileCount: ok.length,
          uploadedBy: me().email,
        });
      } else {
        const { rec } = currentPersonalFolder();
        rec.children.push(...addChildren(rec.children, ok));
      }
      if (failed.length) {
        errEl.hidden = false;
        errEl.textContent = `Uploaded ${ok.length} file(s). Failed: ${failed.join(" · ")}`;
        save();
        render();
        return;
      }
      closeModal();
      save();
      render();
    }

    function submitName() {
      const raw = $("nameInput").value.trim();
      const err = $("nameErr");
      if (!raw) { err.hidden = false; err.textContent = "Name is required."; return; }
      const kind = modalKind.kind;
      const item = modalKind.item;
      if (kind.includes("folder") || kind === "create-project" || kind === "create-folder" || kind === "create-personal-folder") {
        if (isReserved(raw) && !(item && item.id === REQUIRED_ID)) {
          err.hidden = false;
          err.textContent = 'The name "Required Documents" is reserved.';
          return;
        }
      }
      if (kind === "create-project") {
        const name = uniqueName(raw, state.projects.map((p) => p.name));
        const id = uid();
        state.projects.push({ id, name, createdAt: todayKey(), folders: { root: emptyFolder("root", name, null) } });
      } else if (kind === "rename-project") {
        const name = uniqueName(raw, state.projects.filter((p) => p.id !== item.id).map((p) => p.name));
        item.name = name;
        item.folders.root.name = name;
      } else if (kind === "create-folder") {
        const { rec, project } = currentProjectFolder();
        const id = uid();
        const name = uniqueName(raw, rec.children.map((c) => c.name));
        rec.children.push({ id, type: "folder", name });
        project.folders[id] = emptyFolder(id, name, rec.id);
      } else if (kind === "rename-folder") {
        const { rec } = currentProjectFolder();
        const name = uniqueName(raw, rec.children.filter((c) => c.id !== item.id).map((c) => c.name));
        item.name = name;
        const rec2 = projectById(state.ui.projectId).folders[item.id];
        if (rec2) rec2.name = name;
      } else if (kind === "rename-file") {
        const { rec } = currentProjectFolder();
        const name = uniqueName(raw, rec.children.filter((c) => (c.fileId || c.id) !== (item.fileId || item.id)).map((c) => c.name), true);
        item.name = name;
      } else if (kind === "create-personal-folder") {
        const { rec, tree } = currentPersonalFolder();
        const id = uid();
        const name = uniqueName(raw, rec.children.map((c) => c.name));
        rec.children.push({ id, type: "folder", name });
        tree.folders[id] = emptyFolder(id, name, rec.id);
      } else if (kind === "rename-personal-folder") {
        const { rec, tree } = currentPersonalFolder();
        const name = uniqueName(raw, rec.children.filter((c) => c.id !== item.id).map((c) => c.name));
        item.name = name;
        if (tree.folders[item.id]) tree.folders[item.id].name = name;
      } else if (kind === "rename-personal-file") {
        const { rec } = currentPersonalFolder();
        const name = uniqueName(raw, rec.children.filter((c) => (c.fileId || c.id) !== (item.fileId || item.id)).map((c) => c.name), true);
        item.name = name;
      }
      closeModal();
      save();
      render();
    }

    function deleteFolderTree(project, folderId) {
      const rec = project.folders[folderId];
      if (!rec) return;
      for (const c of rec.children || []) {
        if (c.type !== "file") deleteFolderTree(project, c.id);
      }
      delete project.folders[folderId];
    }
    function deletePersonalTree(tree, folderId) {
      const rec = tree.folders[folderId];
      if (!rec) return;
      for (const c of rec.children || []) {
        if (c.type !== "file") deletePersonalTree(tree, c.id);
      }
      delete tree.folders[folderId];
    }

    function confirmDelete() {
      const { kind, item } = modalKind;
      if (kind === "project") {
        state.projects = state.projects.filter((p) => p.id !== item.id);
        if (state.ui.projectId === item.id) { state.ui.projectId = null; state.ui.trail = []; }
      } else if (kind === "folder") {
        const { rec, project } = currentProjectFolder();
        rec.children = rec.children.filter((c) => c.id !== item.id);
        deleteFolderTree(project, item.id);
      } else if (kind === "file") {
        const { rec } = state.tab === "personal" ? currentPersonalFolder() : currentProjectFolder();
        rec.children = rec.children.filter((c) => (c.fileId || c.id) !== (item.fileId || item.id));
      } else if (kind === "personal-folder") {
        const { rec, tree } = currentPersonalFolder();
        rec.children = rec.children.filter((c) => c.id !== item.id);
        deletePersonalTree(tree, item.id);
        state.ui.personalTrail = state.ui.personalTrail.filter((t) => t.id !== item.id);
      }
      closeModal();
      save();
      render();
    }

    function findFile(id) {
      if (state.tab === "projects") {
        const { rec } = currentProjectFolder();
        return rec.children.find((c) => (c.fileId || c.id) === id);
      }
      const { rec } = currentPersonalFolder();
      return rec.children.find((c) => (c.fileId || c.id) === id);
    }
    function findChild(id) {
      if (state.tab === "projects") {
        if (!state.ui.projectId) return state.projects.find((p) => p.id === id);
        const { rec } = currentProjectFolder();
        return rec.children.find((c) => c.id === id);
      }
      const { rec } = currentPersonalFolder();
      return rec.children.find((c) => c.id === id);
    }

    function downloadFile(file) {
      const a = document.createElement("a");
      a.href = file.dataUrl || sampleBlob(file.name);
      a.download = file.name || "document.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    document.body.addEventListener("click", (e) => {
      const roleBtn = e.target.closest("#roleSeg button");
      if (roleBtn) {
        state.role = roleBtn.dataset.role;
        const self = me();
        if (!isAdmin()) {
          state.ui.personalOwner = self.email;
          state.ui.personalTrail = [];
        } else if (!state.ui.personalOwner) {
          state.ui.personalOwner = self.email;
        }
        save();
        render();
        return;
      }
      if (e.target.closest("#tabProjects")) {
        state.tab = "projects"; save(); render(); return;
      }
      if (e.target.closest("#tabPersonal")) {
        state.tab = "personal"; save(); render(); return;
      }
      if (e.target.closest("#resetBtn")) {
        if (confirm("Reset the demo to the original sample folders?")) {
          localStorage.removeItem(STORE_KEY);
          state = seedState();
          render();
        }
        return;
      }
      if (e.target.closest("#bellBtn")) {
        const panel = $("notifyPanel");
        const next = !panel.classList.contains("open");
        panel.classList.toggle("open", next);
        if (next) {
          state.lastSeenAt = new Date().toISOString();
          save();
          renderBell();
        }
        return;
      }
      const note = e.target.closest(".notify-item[data-event]");
      if (note) {
        state.tab = "projects";
        const ev = state.notifications.find((n) => n.eventId === note.dataset.event);
        if (ev) {
          state.ui.projectId = ev.projectId;
          const project = projectById(ev.projectId);
          state.ui.trail = [];
          if (project) {
            const parts = String(ev.folderPath || "").split(" / ").slice(1);
            let parent = "root";
            for (const name of parts) {
              const rec = folderRecord(project, parent);
              const child = (rec?.children || []).find((c) => c.type !== "file" && c.name === name);
              if (!child) break;
              state.ui.trail.push({ id: child.id, name: child.name });
              parent = child.id;
            }
          }
        }
        $("notifyPanel").classList.remove("open");
        save();
        render();
        return;
      }
      if (!e.target.closest(".notify-wrap")) $("notifyPanel").classList.remove("open");

      const actBtn = e.target.closest("[data-act]");
      const act = actBtn?.dataset.act;
      if (act === "close-modal") { closeModal(); return; }
      if (act === "confirm-delete") { confirmDelete(); return; }
      if (act === "create-project") { showNameModal("create-project", "New project folder"); return; }
      if (act === "create-folder") { showNameModal("create-folder", "New folder"); return; }
      if (act === "create-personal-folder") { showNameModal("create-personal-folder", "New folder"); return; }
      if (act === "upload") { showUploadModal("project"); return; }
      if (act === "upload-personal") { showUploadModal("personal"); return; }
      if (act === "back-project") {
        if (state.ui.trail.length) state.ui.trail.pop();
        else state.ui.projectId = null;
        save(); render(); return;
      }
      if (act === "back-personal") {
        state.ui.personalTrail.pop();
        save(); render(); return;
      }
      if (act === "download-file") {
        const row = actBtn.closest("[data-file]");
        downloadFile(findFile(row.dataset.file));
        return;
      }
      if (act === "rename-file") {
        const item = findFile(actBtn.closest("[data-file]").dataset.file);
        showNameModal(state.tab === "personal" ? "rename-personal-file" : "rename-file", "Rename file", item);
        return;
      }
      if (act === "delete-file") {
        const item = findFile(actBtn.closest("[data-file]").dataset.file);
        showDeleteModal("file", item, { folders: 0, files: 0 });
        return;
      }
      if (act === "rename-project") {
        showNameModal("rename-project", "Rename project folder", findChild(actBtn.closest("[data-id]").dataset.id));
        return;
      }
      if (act === "delete-project") {
        const item = findChild(actBtn.closest("[data-id]").dataset.id);
        const counts = countNestedIn((id) => folderRecord(item, id === item.id ? "root" : id), "root");
        showDeleteModal("project", item, counts);
        return;
      }
      if (act === "rename-folder") {
        showNameModal("rename-folder", "Rename folder", findChild(actBtn.closest("[data-id]").dataset.id));
        return;
      }
      if (act === "delete-folder") {
        const item = findChild(actBtn.closest("[data-id]").dataset.id);
        const project = projectById(state.ui.projectId);
        const counts = countNestedIn((id) => folderRecord(project, id), item.id);
        showDeleteModal("folder", item, counts);
        return;
      }
      if (act === "rename-personal-folder") {
        showNameModal("rename-personal-folder", "Rename folder", findChild(actBtn.closest("[data-id]").dataset.id));
        return;
      }
      if (act === "delete-personal-folder") {
        const item = findChild(actBtn.closest("[data-id]").dataset.id);
        if (isPinned(item)) return;
        const { owner } = currentPersonalFolder();
        const counts = countNestedIn((id) => personalFolder(owner, id), item.id);
        showDeleteModal("personal-folder", item, counts);
        return;
      }

      const crumb = e.target.closest("[data-crumb]");
      if (crumb) {
        const idx = Number(crumb.dataset.crumb);
        if (state.tab === "projects") {
          if (idx < 0) { state.ui.projectId = null; state.ui.trail = []; }
          else if (idx === 0) state.ui.trail = [];
          else state.ui.trail = state.ui.trail.slice(0, idx);
        } else {
          if (idx < 0) state.ui.personalTrail = [];
          else state.ui.personalTrail = state.ui.personalTrail.slice(0, idx + 1);
        }
        save(); render(); return;
      }

      const card = e.target.closest(".folder-card[data-open]");
      if (card && !e.target.closest("[data-act]")) {
        const open = card.dataset.open;
        const id = card.dataset.id;
        if (open === "open-project") {
          state.ui.projectId = id;
          state.ui.trail = [];
        } else if (open === "open-folder") {
          const child = findChild(id);
          state.ui.trail.push({ id: child.id, name: child.name });
        } else if (open === "open-personal-folder") {
          const child = findChild(id);
          state.ui.personalTrail.push({ id: child.id, name: child.name });
        }
        save(); render();
      }
    });

    document.body.addEventListener("change", (e) => {
      if (e.target.id === "ownerSelect") {
        state.ui.personalOwner = e.target.value;
        state.ui.personalTrail = [];
        save(); render();
      }
      if (e.target.id === "uploadFiles") {
        pendingFiles = Array.from(e.target.files || []);
        const el = $("fileCount");
        if (el) el.textContent = pendingFiles.length ? `${pendingFiles.length} file${pendingFiles.length === 1 ? "" : "s"} selected` : "";
      }
    });
    document.body.addEventListener("input", (e) => {
      if (e.target.id === "ownerSearch") {
        state.ui.userSearch = e.target.value;
        save();
        const owner = state.ui.personalOwner;
        const self = me();
        const q = e.target.value.trim().toLowerCase();
        const options = PEOPLE.filter((p) => !q || p.name.toLowerCase().includes(q) || p.email.includes(q));
        $("ownerSelect").innerHTML = options.map((p) =>
          `<option value="${p.email}" ${p.email === owner ? "selected" : ""}>${p.email === self.email ? "Me — " : ""}${p.name} (${p.email})</option>`
        ).join("");
      }
    });
    document.body.addEventListener("submit", (e) => {
      if (e.target.id === "nameForm") { e.preventDefault(); submitName(); }
      if (e.target.id === "uploadForm") { e.preventDefault(); handleUpload(modalKind.scope); }
    });
    $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });

    render();
  </script>
</body>
</html>
